packages:
  - 'packages/*'
  - 'apps/*'
# esbuild ships a prebuilt native binary and needs its install script to run.
# Vitest depends on it, so tests cannot execute without this.
allowBuilds:
  esbuild: true
  # Next.js's optional image-optimization binary. This UI is text/data, not
  # images, so there is nothing for it to optimize.
  sharp: false
